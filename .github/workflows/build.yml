name: Build Test APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Beta Test APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.1" \
            "ndk;21.4.7075529"

      - name: Install CMake 3.10.2
        run: |
          mkdir -p "$ANDROID_HOME/cmake"

          curl -L --fail --retry 5 \
            -o /tmp/cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v3.10.2/cmake-3.10.2-Linux-x86_64.tar.gz"

          tar -xzf /tmp/cmake.tar.gz -C /tmp

          rm -rf "$ANDROID_HOME/cmake/3.10.2"

          mv /tmp/cmake-3.10.2-Linux-x86_64 \
             "$ANDROID_HOME/cmake/3.10.2"

          echo "$ANDROID_HOME/cmake/3.10.2/bin" >> "$GITHUB_PATH"

      - name: Create API_KEYS
        run: |
          cat > API_KEYS <<EOF
          APP_ID=${{ secrets.TELEGRAM_APP_ID }}
          APP_HASH="${{ secrets.TELEGRAM_APP_HASH }}"
          MAPS_V2_API="TEST_NO_MAPS_KEY"
          SIGNING_KEY_PASSWORD="ExteraGraTest2026"
          SIGNING_KEY_ALIAS="exteragra"
          SIGNING_KEY_STORE_PASSWORD="ExteraGraTest2026"
          EOF

          cp API_KEYS TMessagesProj/API_KEYS

      - name: Create temporary signing key
        run: |
          mkdir -p TMessagesProj/config

          keytool -genkeypair \
            -v \
            -keystore TMessagesProj/config/extera.jks \
            -alias exteragra \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ExteraGraTest2026 \
            -keypass ExteraGraTest2026 \
            -dname "CN=exteraGra Test, OU=Test, O=exteraGra, C=IQ"

      - name: Disable Google Services for test build
        run: |
          sed -i \
            "/apply plugin: 'com.google.gms.google-services'/d" \
            TMessagesProj/build.gradle

          sed -i \
            "/apply plugin: 'com.google.firebase.crashlytics'/d" \
            TMessagesProj/build.gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Verify build task
        run: |
          ./gradlew tasks --all --no-daemon | grep -E "assembleBetaDebug|betaDebug" || true

      - name: Build APK
        run: |
          ./gradlew assembleBetaDebug \
            --no-daemon \
            --stacktrace \
            -x test \
            -x lint

      - name: Find APK
        if: always()
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: exteraGra-Test-APK
          path: |
            TMessagesProj/build/outputs/apk/**/*.apk
            TMessagesProj/build/outputs/apk/*.apk
          if-no-files-found: error
