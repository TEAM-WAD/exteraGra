name: Build exteraGram APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Xmx6144m -Xss12m -XX:+UseG1GC -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create API_KEYS File
        run: |
          printf 'APP_ID=6\nAPP_HASH="eb06d4abfb49dc3eeb1aeb98ae0f581e"\nMAPS_V2_API="abcdef1234567890abcdef1234567890"\nSIGNING_KEY_PASSWORD="password"\nSIGNING_KEY_ALIAS="alias"\nSIGNING_KEY_STORE_PASSWORD="password"\nAPP_CENTER_HASH="00000000-0000-0000-0000-000000000000"\nPLAYSERVICES_APP_ID="dummy"\n' > API_KEYS
          cp API_KEYS TMessagesProj/API_KEYS || true

      - name: Create Dummy Configs
        run: |
          mkdir -p TMessagesProj/config
          rm -f TMessagesProj/config/extera.jks
          keytool -genkeypair -v -keystore TMessagesProj/config/extera.jks -alias alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=extera, OU=extera, O=extera, L=City, S=State, C=US"
          printf '{"project_info":{"project_number":"1234567890","project_id":"exteragram-build"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:1234567890abcdef","android_client_info":{"package_name":"com.exteragram.messenger"}},"api_key":[{"current_key":"dummy"}]}]}' > TMessagesProj/google-services.json

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: |
          ./gradlew :TMessagesProj:assembleDebug \
            --no-configuration-cache \
            --no-daemon \
            -PAPP_CENTER_HASH='"00000000-0000-0000-0000-000000000000"' \
            -PMAPS_V2_API='"abcdef1234567890abcdef1234567890"' \
            -PPLAYSERVICES_APP_ID='"dummy"' \
            -x test

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exteraGram-APK
          path: '**/*.apk'
