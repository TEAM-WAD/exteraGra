name: Fast exteraGram Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Xmx6g -XX:+UseG1GC -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew Executable
        run: chmod +x gradlew

      - name: Build APK (Arm64 Debug)
        run: |
          ./gradlew assembleDebug \
            -PabiList=arm64-v8a \
            -x test \
            -x lint \
            -x lintVitalRelease \
            --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exteraGram-Arm64
          path: '**/*.apk'
