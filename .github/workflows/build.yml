name: Build exteraGra APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Afat Release APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.1" \
            "ndk;21.4.7075529"

      - name: Install CMake 3.10.2
        run: |
          CMAKE_VERSION="3.10.2"
          CMAKE_DIR="$ANDROID_HOME/cmake/$CMAKE_VERSION"

          mkdir -p "$ANDROID_HOME/cmake"

          curl -L --fail --retry 5 --retry-delay 3 \
            -o /tmp/cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-Linux-x86_64.tar.gz"

          tar -xzf /tmp/cmake.tar.gz -C /tmp

          rm -rf "$CMAKE_DIR"
          mv "/tmp/cmake-${CMAKE_VERSION}-Linux-x86_64" "$CMAKE_DIR"

          echo "$CMAKE_DIR/bin" >> "$GITHUB_PATH"

          "$CMAKE_DIR/bin/cmake" --version

      - name: Verify Android toolchain
        run: |
          java -version
          adb version
          cmake --version

          test -d "$ANDROID_HOME/ndk/21.4.7075529"

      # ==========================================================
      # Telegram API
      # APP_ID  = 30357243
      # APP_HASH = 9782c26101c502f026721b8e7993786c
      #
      # APP_HASH MUST remain quoted because Gradle uses it as
      # a Java String BuildConfig field.
      # ==========================================================

      - name: Prepare API_KEYS
        run: |
          cat > API_KEYS <<'EOF'
          APP_ID=30357243
          APP_HASH="9782c26101c502f026721b8e7993786c"
          MAPS_V2_API=""
          SIGNING_KEY_PASSWORD="ExteraBuild123"
          SIGNING_KEY_ALIAS="extera"
          SIGNING_KEY_STORE_PASSWORD="ExteraStore123"
          EOF

          cp API_KEYS TMessagesProj/API_KEYS

      # ==========================================================
      # Temporary debug signing key
      # No GitHub Secrets required.
      # ==========================================================

      - name: Prepare temporary signing key
        run: |
          mkdir -p TMessagesProj/config

          rm -f TMessagesProj/config/extera.jks

          keytool -genkeypair \
            -v \
            -keystore TMessagesProj/config/extera.jks \
            -alias "extera" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype JKS \
            -storepass "ExteraStore123" \
            -keypass "ExteraBuild123" \
            -dname "CN=exteraGra, OU=Build, O=exteraGra, L=Baghdad, S=Baghdad, C=IQ"

          keytool -list \
            -keystore TMessagesProj/config/extera.jks \
            -storepass "ExteraStore123"

      # ==========================================================
      # Disable Google Services / Crashlytics plugins for CI.
      # No google-services.json required.
      # ==========================================================

      - name: Disable Google Services plugins
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("TMessagesProj/build.gradle")
          text = path.read_text()

          text = text.replace(
              "apply plugin: 'com.google.gms.google-services'",
              "// Google Services disabled for CI"
          )

          text = text.replace(
              "apply plugin: 'com.google.firebase.crashlytics'",
              "// Firebase Crashlytics disabled for CI"
          )

          path.write_text(text)
          PY

          rm -f TMessagesProj/google-services.json

          echo "Google Services plugins disabled."

      # ==========================================================
      # Disable Maps API requirement.
      # The project expects MAPS_V2_API, so an empty value is
      # supplied instead of requiring a Maps secret.
      # ==========================================================

      - name: Configure Maps value
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("TMessagesProj/build.gradle")
          text = path.read_text()

          text = text.replace(
              "resValue 'string', 'MAPS_V2_API', localProperties.getProperty(\"MAPS_V2_API\")",
              "resValue 'string', 'MAPS_V2_API', ''"
          )

          path.write_text(text)
          PY

      # ==========================================================
      # Fix Android XML string formatting.
      # IMPORTANT:
      # No nonlocal / nested function / changed variable.
      # ==========================================================

      - name: Fix Android string resource formatting
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path("TMessagesProj/src/main/res"),
              Path("TMessagesProj/src/main/res-solar"),
              Path("TMessagesProj/src/main/res-tabs"),
          ]

          fixed = 0

          for root in roots:
              if not root.exists():
                  continue

              for path in root.rglob("strings.xml"):
                  try:
                      text = path.read_text(encoding="utf-8")
                  except Exception:
                      continue

                  old = text

                  def fix_string(match):
                      attrs = match.group(1)
                      body = match.group(2)

                      if "%1$" in body or "%2$" in body or "%3$" in body or "%4$" in body:
                          if 'formatted="false"' not in attrs:
                              attrs = attrs.rstrip() + ' formatted="false"'

                      return "<string" + attrs + ">" + body + "</string>"

                  text = re.sub(
                      r"<string([^>]*)>(.*?)</string>",
                      fix_string,
                      text,
                      flags=re.DOTALL
                  )

                  if text != old:
                      path.write_text(text, encoding="utf-8")
                      fixed += 1

          print("XML files fixed:", fixed)
          PY

      # ==========================================================
      # Gradle configuration
      # ==========================================================

      - name: Configure Gradle
        run: |
          cat >> gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx6144m -XX:+UseG1GC
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.caching=true
          android.enableR8.fullMode=false
          kotlin.incremental=false
          EOF

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Show Gradle version
        run: |
          ./gradlew --version

      - name: Clean project
        run: |
          ./gradlew clean --no-daemon --stacktrace

      - name: Verify Afat Release task
        run: |
          ./gradlew tasks --all --no-daemon | grep -i "assembleAfatRelease"

      # ==========================================================
      # BUILD
      # ==========================================================

      - name: Build Afat Release APK
        run: |
          ./gradlew assembleAfatRelease \
            --no-daemon \
            --stacktrace \
            --info \
            -x test \
            -x lint

      # ==========================================================
      # Locate APK
      # ==========================================================

      - name: Locate APK
        if: always()
        run: |
          echo "======================================"
          echo "Generated APK files"
          echo "======================================"

          find TMessagesProj/build \
            -type f \
            \( -name "*.apk" -o -name "*.aab" \) \
            -print || true

      # ==========================================================
      # Upload APK
      # ==========================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: exteraGra-Afat-Release
          path: |
            TMessagesProj/build/outputs/apk/**/*.apk
            TMessagesProj/build/outputs/apk/*.apk
          if-no-files-found: error
