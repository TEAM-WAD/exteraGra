name: Build Beta Test APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Beta Test APK
    runs-on: ubuntu-22.04

    steps:

      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout source
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # Java
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle


      # ---------------------------------------------------------
      # Android SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ---------------------------------------------------------
      # Install required Android packages
      # ---------------------------------------------------------
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.1" \
            "ndk;21.4.7075529"


      # ---------------------------------------------------------
      # CMake 3.10.2
      # ---------------------------------------------------------
      - name: Install CMake 3.10.2
        run: |
          set -e

          rm -rf /tmp/cmake-3.10.2-Linux-x86_64
          rm -f /tmp/cmake-3.10.2.tar.gz

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            -o /tmp/cmake-3.10.2.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v3.10.2/cmake-3.10.2-Linux-x86_64.tar.gz"

          tar -xzf /tmp/cmake-3.10.2.tar.gz -C /tmp

          mkdir -p "$ANDROID_HOME/cmake"

          rm -rf "$ANDROID_HOME/cmake/3.10.2"

          mv \
            /tmp/cmake-3.10.2-Linux-x86_64 \
            "$ANDROID_HOME/cmake/3.10.2"

          echo "$ANDROID_HOME/cmake/3.10.2/bin" >> "$GITHUB_PATH"


      # ---------------------------------------------------------
      # Verify toolchain
      # ---------------------------------------------------------
      - name: Verify Android toolchain
        run: |
          echo "Java:"
          java -version

          echo
          echo "CMake:"
          cmake --version

          echo
          echo "NDK:"
          test -d "$ANDROID_HOME/ndk/21.4.7075529"
          echo "NDK 21.4.7075529 OK"

          echo
          echo "Android SDK:"
          test -d "$ANDROID_HOME/platforms/android-33"
          echo "Android 33 OK"


      # ---------------------------------------------------------
      # API KEYS
      #
      # APP_HASH MUST be quoted because build.gradle uses:
      #
      # buildConfigField 'String', 'APP_HASH',
      # localProperties.getProperty("APP_HASH")
      # ---------------------------------------------------------
      - name: Prepare API_KEYS
        run: |
          cat > API_KEYS <<'EOF'
          APP_ID=30357243
          APP_HASH="9782c26101c502f026721b8e7993786c"
          MAPS_V2_API=""
          SIGNING_KEY_PASSWORD=ExteraGraTest2026
          SIGNING_KEY_ALIAS=exteragra
          SIGNING_KEY_STORE_PASSWORD=ExteraGraTest2026
          EOF

          echo "API_KEYS prepared."


      # ---------------------------------------------------------
      # Create temporary signing key
      # ---------------------------------------------------------
      - name: Prepare signing key
        run: |
          set -e

          mkdir -p TMessagesProj/config

          rm -f TMessagesProj/config/extera.jks

          keytool \
            -genkeypair \
            -v \
            -keystore TMessagesProj/config/extera.jks \
            -alias exteragra \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype JKS \
            -storepass ExteraGraTest2026 \
            -keypass ExteraGraTest2026 \
            -dname "CN=exteraGra Test, OU=Test, O=exteraGra, C=IQ"

          echo "Signing key created."


      # ---------------------------------------------------------
      # Verify signing key
      # ---------------------------------------------------------
      - name: Verify signing key
        run: |
          keytool \
            -list \
            -keystore TMessagesProj/config/extera.jks \
            -storepass ExteraGraTest2026

          echo "Signing key verified."


      # ---------------------------------------------------------
      # Disable Google Services plugins for CI
      #
      # The repository currently applies both plugins directly
      # inside TMessagesProj/build.gradle.
      #
      # This prevents the build from requiring
      # google-services.json / Firebase configuration.
      # ---------------------------------------------------------
      - name: Disable Google Services plugins for test build
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("TMessagesProj/build.gradle")
          text = p.read_text()

          text = text.replace(
              "apply plugin: 'com.google.gms.google-services'\n",
              ""
          )

          text = text.replace(
              "apply plugin: 'com.google.firebase.crashlytics'\n",
              ""
          )

          p.write_text(text)

          print("Google Services plugins disabled for this CI build.")
          PY


      # ---------------------------------------------------------
      # Fix problematic Android string resources
      #
      # Only resources that contain multiple non-positional
      # formatting substitutions are marked formatted=false.
      #
      # This is done only in the CI workspace and does NOT modify
      # the repository source permanently.
      # ---------------------------------------------------------
      - name: Fix Android string resource formatting
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("TMessagesProj/src/main")

          changed = 0

          # Android printf-style substitutions.
          # Ignore escaped %%.
          pattern = re.compile(
              r'%(?!%)(?:\d+\$)?[a-zA-Z]'
          )

          for path in root.rglob("strings.xml"):
              text = path.read_text(encoding="utf-8")

              def fix_string(match):
                  nonlocal changed

                  opening = match.group(1)
                  name = match.group(2)
                  attrs = match.group(3)
                  body = match.group(4)
                  closing = match.group(5)

                  substitutions = pattern.findall(body)

                  # Only handle strings with more than one
                  # non-positional substitution.
                  if len(substitutions) > 1:
                      positional = re.findall(
                          r'%(\d+)\$[a-zA-Z]',
                          body
                      )

                      if len(positional) == 0:
                          if 'formatted=' not in attrs:
                              changed += 1

                              if attrs.strip():
                                  attrs = attrs.rstrip() + ' formatted="false"'
                              else:
                                  attrs = ' formatted="false"'

                              return (
                                  opening +
                                  name +
                                  attrs +
                                  ">" +
                                  body +
                                  closing
                              )

                  return match.group(0)

              # XML string elements.
              regex = re.compile(
                  r'(<string\s+name="([^"]+)"([^>]*)>)'
                  r'(.*?)'
                  r'(</string>)',
                  re.DOTALL
              )

              new_text = regex.sub(
                  lambda m: fix_string(
                      type("M", (), {
                          "group": lambda self, n: {
                              1: m.group(1),
                              2: m.group(2),
                              3: m.group(3),
                              4: m.group(4),
                              5: m.group(5)
                          }[n]
                      })()
                  ),
                  text
              )

              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")

          print(f"Fixed {changed} problematic string resources.")
          PY


      # ---------------------------------------------------------
      # Make Gradle executable
      # ---------------------------------------------------------
      - name: Prepare Gradle
        run: |
          chmod +x ./gradlew


      # ---------------------------------------------------------
      # Clean build
      # ---------------------------------------------------------
      - name: Clean project
        run: |
          ./gradlew clean \
            --no-daemon \
            --stacktrace


      # ---------------------------------------------------------
      # Verify Beta task
      # ---------------------------------------------------------
      - name: Verify Beta build task
        run: |
          ./gradlew tasks --all --no-daemon | grep -E \
            "assembleBetaDebug|compileBetaDebugJavaWithJavac" \
            || true


      # ---------------------------------------------------------
      # Build Beta Debug APK
      # ---------------------------------------------------------
      - name: Build Beta Debug APK
        run: |
          ./gradlew assembleBetaDebug \
            --no-daemon \
            --stacktrace \
            --info


      # ---------------------------------------------------------
      # Find generated APK
      # ---------------------------------------------------------
      - name: Locate APK
        if: always()
        run: |
          echo "===================================="
          echo "Generated APK files"
          echo "===================================="

          find TMessagesProj/build/outputs \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null || true


      # ---------------------------------------------------------
      # Upload APK
      # ---------------------------------------------------------
      - name: Upload Beta APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: exteraGra-Beta-Test-APK
          path: |
            TMessagesProj/build/outputs/apk/**/*.apk
            TMessagesProj/build/outputs/apk/*.apk
          if-no-files-found: error
