name: Build exteraGra

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Afat Release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.1" \
            "ndk;21.4.7075529"

      - name: Install CMake 3.10.2
        run: |
          CMAKE_VERSION="3.10.2"
          CMAKE_DIR="$ANDROID_HOME/cmake/$CMAKE_VERSION"

          mkdir -p "$ANDROID_HOME/cmake"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            -o /tmp/cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-Linux-x86_64.tar.gz"

          tar -xzf /tmp/cmake.tar.gz -C /tmp

          rm -rf "$CMAKE_DIR"

          mv "/tmp/cmake-${CMAKE_VERSION}-Linux-x86_64" "$CMAKE_DIR"

          echo "$CMAKE_DIR/bin" >> "$GITHUB_PATH"

          echo "CMake installed:"
          "$CMAKE_DIR/bin/cmake" --version

      - name: Verify Android toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"

          java -version
          adb version

          echo "NDK:"
          ls -la "$ANDROID_HOME/ndk/21.4.7075529"

          echo "CMake:"
          cmake --version

      - name: Prepare API_KEYS
        run: |
          cat > API_KEYS <<EOF
          APP_ID=${{ secrets.TELEGRAM_APP_ID }}
          APP_HASH="${{ secrets.TELEGRAM_APP_HASH }}"
          MAPS_V2_API="${{ secrets.MAPS_V2_API }}"
          SIGNING_KEY_PASSWORD="${{ secrets.SIGNING_KEY_PASSWORD }}"
          SIGNING_KEY_ALIAS="${{ secrets.SIGNING_KEY_ALIAS }}"
          SIGNING_KEY_STORE_PASSWORD="${{ secrets.SIGNING_KEY_STORE_PASSWORD }}"
          APP_CENTER_HASH="${{ secrets.APP_CENTER_HASH }}"
          PLAYSERVICES_APP_ID="${{ secrets.PLAYSERVICES_APP_ID }}"
          EOF

          cp API_KEYS TMessagesProj/API_KEYS

      - name: Prepare signing key
        run: |
          mkdir -p TMessagesProj/config

          if [ -n "${{ secrets.SIGNING_KEY_BASE64 }}" ]; then
            echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > TMessagesProj/config/extera.jks
          else
            keytool -genkeypair \
              -v \
              -keystore TMessagesProj/config/extera.jks \
              -alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${{ secrets.SIGNING_KEY_STORE_PASSWORD }}" \
              -keypass "${{ secrets.SIGNING_KEY_PASSWORD }}" \
              -dname "CN=exteraGra, OU=exteraGra, O=exteraGra, L=City, S=State, C=IQ"
          fi

      - name: Prepare Google Services
        run: |
          cat > TMessagesProj/google-services.json <<EOF
          {
            "project_info": {
              "project_number": "${{ secrets.GOOGLE_PROJECT_NUMBER }}",
              "project_id": "${{ secrets.GOOGLE_PROJECT_ID }}"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "${{ secrets.GOOGLE_MOBILE_SDK_APP_ID }}",
                  "android_client_info": {
                    "package_name": "org.telegram.messenger"
                  }
                },
                "api_key": [
                  {
                    "current_key": "${{ secrets.GOOGLE_API_KEY }}"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Configure Gradle
        run: |
          cat >> gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx6144m -XX:+UseG1GC
          android.enableR8.fullMode=false
          kotlin.incremental=false
          EOF

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Show available Afat tasks
        run: |
          ./gradlew tasks --all --no-daemon | grep -i "afat" || true

      - name: Build Afat Release
        run: |
          ./gradlew assembleAfatRelease \
            --no-daemon \
            --stacktrace \
            -x test \
            -x lint

      - name: Find APK
        if: always()
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: exteraGra-Afat-Release
          path: |
            TMessagesProj/build/outputs/apk/**/*.apk
            TMessagesProj/build/outputs/apk/*.apk
          if-no-files-found: error
