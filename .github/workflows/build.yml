name: Build Test APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Beta Test APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.1" \
            "ndk;21.4.7075529"

      - name: Install CMake 3.10.2
        run: |
          mkdir -p "$ANDROID_HOME/cmake"

          curl -L \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            -o /tmp/cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v3.10.2/cmake-3.10.2-Linux-x86_64.tar.gz"

          tar -xzf /tmp/cmake.tar.gz -C /tmp

          rm -rf "$ANDROID_HOME/cmake/3.10.2"

          mv \
            /tmp/cmake-3.10.2-Linux-x86_64 \
            "$ANDROID_HOME/cmake/3.10.2"

          echo "$ANDROID_HOME/cmake/3.10.2/bin" >> "$GITHUB_PATH"

      - name: Verify Android Toolchain
        run: |
          java -version
          cmake --version

          test -d "$ANDROID_HOME/ndk/21.4.7075529"

          echo "Android SDK: OK"
          echo "NDK: OK"
          echo "CMake: OK"

      - name: Create API_KEYS
        run: |
          cat > API_KEYS <<'EOF'
          APP_ID=30357243
          APP_HASH=9782c26101c502f026721b8e7993786c
          MAPS_V2_API=
          SIGNING_KEY_PASSWORD=ExteraGraTest2026
          SIGNING_KEY_ALIAS=exteragra
          SIGNING_KEY_STORE_PASSWORD=ExteraGraTest2026
          EOF

          echo "API_KEYS created."

      - name: Create Temporary Signing Key
        run: |
          mkdir -p TMessagesProj/config

          rm -f TMessagesProj/config/extera.jks

          keytool -genkeypair \
            -v \
            -keystore TMessagesProj/config/extera.jks \
            -alias exteragra \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype JKS \
            -storepass ExteraGraTest2026 \
            -keypass ExteraGraTest2026 \
            -dname "CN=exteraGra Test, OU=Test, O=exteraGra, C=IQ"

          echo "Temporary signing key created."

      - name: Verify Signing Key
        run: |
          keytool \
            -list \
            -keystore TMessagesProj/config/extera.jks \
            -storepass ExteraGraTest2026

          echo "Signing key verified."

      - name: Check Google Services
        run: |
          if [ -f TMessagesProj/google-services.json ]; then
            echo "google-services.json found."
          else
            echo "google-services.json not found."
            exit 1
          fi

      - name: Make Gradle Executable
        run: |
          chmod +x ./gradlew

      - name: Clean
        run: |
          ./gradlew clean --no-daemon

      - name: Check Beta Tasks
        run: |
          ./gradlew tasks --all --no-daemon | grep -i "beta" || true

      - name: Build Beta Debug APK
        run: |
          ./gradlew assembleBetaDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        if: always()
        run: |
          echo "Generated APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: exteraGra-Test-APK
          path: |
            TMessagesProj/build/outputs/apk/**/*.apk
            TMessagesProj/build/outputs/apk/*.apk
          if-no-files-found: error
