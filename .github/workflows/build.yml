name: Fast exteraGram Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Xmx6g -XX:+UseG1GC -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
      APP_CENTER_HASH: '"00000000-0000-0000-0000-000000000000"'
      MAPS_API_KEY: '"dummy"'
      PLAYSERVICES_APP_ID: '"dummy"'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew Executable
        run: chmod +x gradlew

      - name: Inject Properties Files
        run: |
          cat <<EOF > local.properties
          sdk.dir=/usr/local/lib/android/sdk
          APP_CENTER_HASH="00000000-0000-0000-0000-000000000000"
          MAPS_API_KEY="dummy"
          PLAYSERVICES_APP_ID="dummy"
          EOF

          cat <<EOF >> gradle.properties
          APP_CENTER_HASH="00000000-0000-0000-0000-000000000000"
          MAPS_API_KEY="dummy"
          PLAYSERVICES_APP_ID="dummy"
          EOF

      - name: Build APK (Arm64 Debug)
        run: |
          ./gradlew assembleDebug \
            -PabiList=arm64-v8a \
            -PAPP_CENTER_HASH="\"00000000-0000-0000-0000-000000000000\"" \
            -PMAPS_API_KEY="\"dummy\"" \
            -PPLAYSERVICES_APP_ID="\"dummy\"" \
            -x test \
            -x lint \
            -x lintVitalRelease \
            --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exteraGram-Arm64
          path: '**/*.apk'
